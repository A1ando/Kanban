<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目看板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
    <script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container-fluid py-3 px-4">
    <!-- 顶栏 -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2 top-bar-row">
        <div>
            <h4 class="fw-bold mb-1"><i class="bi bi-kanban text-primary me-2"></i>项目看板</h4>
            <!-- <p class="text-muted mb-0">项目总览</p> -->
        </div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <button class="btn btn-outline-secondary btn-sm" id="toggleLeftBtn">
                <i class="bi bi-layout-sidebar"></i> 折叠左侧
            </button>
            <div class="btn-group shadow-sm" role="group" id="viewModeGroup">
                <button type="button" class="btn btn-outline-primary btn-sm" data-mode="day">日</button>
                <button type="button" class="btn btn-outline-primary btn-sm" data-mode="week">周</button>
                <button type="button" class="btn btn-outline-primary btn-sm active" data-mode="fortnight">双周</button>
                <button type="button" class="btn btn-outline-primary btn-sm" data-mode="month">月</button>
                <button type="button" class="btn btn-outline-primary btn-sm" data-mode="quarter">季度</button>
            </div>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addNodeModal">
                <i class="bi bi-plus-circle me-1"></i>插入节点
            </button>
            <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#addProjectModal">
                <i class="bi bi-folder-plus"></i> 新增项目
            </button>
            <button class="btn btn-info btn-sm" id="exportExcelBtn">
                <i class="bi bi-file-earmark-excel"></i> 导出 Excel
            </button>
            <button class="btn btn-outline-secondary btn-sm" id="toggleTopBar" title="隐藏图例">
                <i class="bi bi-chevron-up"></i>
            </button>
        </div>
    </div>

    <!-- 图例 -->
    <div class="d-flex align-items-center gap-3 mb-3 p-2 bg-white rounded border flex-wrap legend-row">
        <span class="fw-bold"><i class="bi bi-info-circle me-1"></i>图例:</span>
        <span class="badge" style="background:#120101; color:#fff;">主项目</span>
        <span class="badge" style="background:linear-gradient(90deg,#3b82f6,#2563eb);">进行中</span>
        <span class="badge" style="background:#6c757d; color:#fff;">未开始</span>
        <span class="badge" style="background:linear-gradient(90deg,#22c55e,#16a34a);">已完成</span>
        <span class="badge" style="background:#dc3545;">延迟</span>
        <span class="badge" style="background:#dcfce7; border:2px solid #22c55e; color:#2563eb;">提前</span>
        <span class="badge bg-warning text-dark"><i class="bi bi-telephone-fill"></i> 沟通会</span>
        <span class="badge" style="background:#a855f7; color:#fff;"><i class="bi bi-flag-fill"></i> 里程碑</span>
        <span class="text-muted ms-auto small"><i class="bi bi-hand-index-thumb me-1"></i>拖拽时间轴滚动 · 滚轮纵向浏览</span>
    </div>

    <!-- 甘特图 -->
    <div class="gantt-board-container" id="ganttBoard">
        <div class="gantt-left-panel" id="leftPanel">
            <div class="panel-header" id="panelHeader">
                <!-- 新增展开/折叠全部按钮 -->
                <span class="collapse-all-icon" id="collapseAllBtn" title="折叠全部项目">
                    <i class="bi bi-arrows-collapse"></i>
                </span>
                <div class="col-label col-name" style="padding-left:4px;">项目 / 节点名称</div>
                <div class="col-label col-owner" id="headOwner">负责人</div>
                <div class="col-label col-man-days" id="headManDays">人天</div>
                <div class="col-label col-natural" id="headNatural">自然日</div>
                <div class="col-label col-work" id="headWork">工作日</div>
            </div>
            <div id="leftTreeRows"></div>
        </div>
        <div class="gantt-right-panel" id="rightPanel">
            <div class="timeline-header" id="timelineHeader"></div>
            <div id="rightTimelineRows" style="position: relative;"></div>
            <div class="hover-line" id="hoverLine"><span class="hover-line-tag" id="hoverTag"></span></div>
            <div class="today-line" id="todayLine"></div>
            <div class="marker-line" id="markerLine" style="display:none;"><span class="marker-tag" id="markerTag"></span></div>
        </div>
    </div> 
</div>

<!-- 卡片 tooltip -->
<div class="bar-tooltip-card" id="barTooltipCard">
    <div class="title" id="tipTitle">任务名</div>
    <div class="row"><span class="label">开始日期</span><span class="value" id="tipStart">-</span></div>
    <div class="row"><span class="label">预计结束</span><span class="value" id="tipEnd">-</span></div>
    <div class="row" id="tipActualRow" style="display:none;"><span class="label">实际结束</span><span class="value actual" id="tipActual">-</span></div>
</div>

<!-- ========== 编辑模态框 ========== -->
<div class="modal modal-fullscreen" id="editModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header border-bottom">
                <h5 class="modal-title" id="editModalLabel">编辑节点</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="left-pane">
                    <div class="editor-label"><i class="bi bi-markdown me-1"></i>说明 / 备注 (支持 Markdown)</div>
                    <div class="editor-wrapper">
                        <textarea id="editDescription"></textarea>
                    </div>
                </div>
                <div class="right-pane">
                    <input type="hidden" id="editId">
                    <input type="hidden" id="editCategory">
                    <div class="field-group">
                        <label>名称</label>
                        <input type="text" class="form-control" id="editName" required>
                    </div>
                    <div class="field-group">
                        <label>负责人</label>
                        <input type="text" class="form-control" id="editOwner">
                    </div>
                    <div id="subTaskFields">
                        <div class="field-group">
                            <label>人天</label>
                            <input type="number" step="0.5" class="form-control" id="editManDays">
                        </div>
                        <div class="field-group">
                            <label>进度 (%)</label>
                            <input type="number" class="form-control" id="editProgress" min="0" max="100" disabled>
                        </div>
                        <div class="field-group">
                            <label>开始日期</label>
                            <input type="date" class="form-control" id="editStart">
                        </div>
                        <div class="field-group">
                            <label>预计结束日期</label>
                            <input type="date" class="form-control" id="editEnd">
                        </div>
                        <div class="field-group">
                            <label>实际结束日期 (留空未完成)</label>
                            <input type="date" class="form-control" id="editActualEnd">
                        </div>
                    </div>
                    <div id="eventFields" style="display: none;">
                        <div class="field-group">
                            <label>发生日期</label>
                            <input type="date" class="form-control" id="editEventDate">
                        </div>
                    </div>
                    <div class="btn-group-vertical w-100 mt-2">
                        <button type="button" class="btn btn-primary" id="saveEditBtn">
                            <i class="bi bi-check2"></i> 保存更新
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="clearActualBtn" title="清空实际完成日期">
                            <i class="bi bi-eraser"></i> 清空实际完成
                        </button>
                        <button type="button" class="btn btn-danger" id="deleteNodeBtn">
                            <i class="bi bi-trash"></i> 删除节点
                        </button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ========== 新增节点 Modal ========== -->
<div class="modal fade" id="addNodeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">插入节点 / 子任务</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="nodeForm">
                    <div class="mb-3">
                        <label class="form-label">归属主项目</label>
                        <select class="form-select" id="mainProjectId" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">节点类型</label>
                        <select class="form-select" id="nodeType" required>
                            <option value="sub">常规子任务</option>
                            <option value="meeting">📌 沟通会</option>
                            <option value="milestone">🚩 里程碑</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">名称 / 主题</label>
                        <input type="text" class="form-control" id="nodeName" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">负责人</label>
                            <input type="text" class="form-control" id="nodeOwner" value="张伟">
                        </div>
                        <div class="col-md-6 mb-3" id="manDaysInput">
                            <label class="form-label">人天估算</label>
                            <input type="number" step="0.5" class="form-control" id="nodeManDays" value="1">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" id="startLabel">开始日期</label>
                            <input type="date" class="form-control" id="startDate" required>
                        </div>
                        <div class="col-md-6 mb-3" id="endContainer">
                            <label class="form-label">预计结束日期</label>
                            <input type="date" class="form-control" id="endDate">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">说明事项</label>
                        <textarea class="form-control" id="nodeDescription" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">序号（越小越靠前）</label>
                        <input type="number" class="form-control" id="nodeSort" value="1" step="1">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="submitNodeBtn">确认添加</button>
            </div>
        </div>
    </div>
</div>

<!-- ========== 新增项目 Modal ========== -->
<div class="modal fade" id="addProjectModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">新增主项目</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addProjectForm">
                    <div class="mb-3">
                        <label class="form-label">项目名称 *</label>
                        <input type="text" class="form-control" id="newProjectName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">负责人</label>
                        <input type="text" class="form-control" id="newProjectOwner">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">描述</label>
                        <textarea class="form-control" id="newProjectDesc" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">序号（越小越靠前）</label>
                        <input type="number" class="form-control" id="newProjectSort" value="1" step="1">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="submitProjectBtn">创建项目</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
